kind = "web"
previewPath = "/"
title = "PostLapAI"
version = "1.0.0"
id = "artifacts/postlap-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18161

[services.development]
run = "pnpm --filter @workspace/postlap-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/postlap-ai", "run", "build" ]
publicDir = "artifacts/postlap-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18161"
BASE_PATH = "/"
